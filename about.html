<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>About us · Cha/Té</title>
<meta name="description" content="Cha/Té: a pop-up tasting menu through the world's tea rituals. 1–12 February 2027, Institut Lyfe, Écully.">
<meta name="theme-color" content="#F1E7CF">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body class="paper page-about">
<main>
<header class="page-head"><div class="wrap head-grid">
  <svg class="wash" id="wash" aria-hidden="true"></svg>
  <div class="head-text">
    <h1 data-t="about.title"></h1>
    <p class="lede" data-t="about.lede"></p>
  </div>
  <figure class="head-photo ph"><img src="assets/img/teas/oolong.webp" alt="" decoding="async" fetchpriority="high"></figure>
</div></header>

<section class="section"><div class="wrap stats">
  <div><b>13</b><span data-t="about.numStudents"></span></div>
  <div><b>14</b><span data-t="about.numCultures"></span></div>
  <div><b>12</b><span data-t="about.numDays"></span></div>
</div></section>
<section class="section"><div class="wrap two">
  <div class="story-side">
    <h2 data-t="about.storyTitle"></h2>
    <figure class="side-photo ph"><img src="assets/img/teas/white.webp" alt="" loading="lazy" decoding="async"></figure>
  </div>
  <div class="prose" id="about-story"></div>
</div></section>
<section class="section band"><div class="wrap">
  <h2 data-t="about.mapTitle"></h2>
  <div class="dotmap" id="dotmap"><img src="assets/img/world-dots.svg" alt=""></div>
  <p class="note" data-t="about.mapNote"></p>
</div></section>
<section class="section"><div class="wrap">
  <h2 data-t="about.teamTitle"></h2>
  <div class="team" id="team"></div>
</div></section>
</main>
<script src="assets/js/content.js"></script>
<script src="assets/js/logo.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/pages.js"></script>
</body>
</html>
