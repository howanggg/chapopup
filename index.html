<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cha/Té · Pop-up tea tasting menu</title>
<meta name="description" content="Cha/Té: a pop-up tasting menu through the world's tea rituals. 1–12 February 2027, Institut Lyfe, Écully.">
<meta name="theme-color" content="#F1E7CF">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap">
<link rel="stylesheet" href="assets/css/site.css?v=1119b">
<link rel="stylesheet" href="assets/css/home.css?v=1119b">
</head>
<body class="home" data-no-solid="1">

<main>
  <!-- ACTS 1 + 2 share one pinned stage, so the painting turns into the tea room without any seam.
       Act 1: only the cup at first; as you scroll, its steam rises as one ink line and sweeps the ensō. The camera moves in on the cup,
       the paper now holds an ink painting of the tea room, and that painting soaks into the real photograph.
       Act 2: the real cup and teapot; click to pour (a short film that starts and ends on the photograph). -->
  <section class="act act-story" id="ink" aria-labelledby="hero-title">
    <div class="stick">
      <div class="ink-layer paper" id="ink-layer">
        <div class="mtn far"><img src="assets/img/ink-far.webp" alt="" decoding="async"></div>
        <div class="mtn mid"><img src="assets/img/ink-mid.webp" alt="" decoding="async"></div>
        <div class="mist m1"></div>
        <div class="mist m2"></div>

        <div class="hero-logo-wrap">
          <div class="logo-zoom" id="logo-zoom">
            <svg class="hero-logo logo-wash" id="logo-wash" aria-hidden="true">
              <defs><filter id="wash" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter></defs>
              <path id="p-wash" filter="url(#wash)"/>
            </svg>
            <svg class="hero-logo" id="hero-logo" aria-hidden="true">
              <defs>
                <linearGradient id="wipe-g"><stop offset="0" stop-color="#fff"/><stop offset=".82" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
                <mask id="stroke-mask" maskUnits="userSpaceOnUse" x="100" y="40" width="800" height="800">
                  <path id="mask-path" fill="none" stroke="#fff" stroke-width="64" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>
                </mask>
                <radialGradient id="puff-g"><stop offset="0" stop-color="#23402F" stop-opacity=".55"/><stop offset=".45" stop-color="#23402F" stop-opacity=".18"/><stop offset="1" stop-color="#23402F" stop-opacity="0"/></radialGradient>
                <mask id="word-mask" maskUnits="userSpaceOnUse" x="100" y="500" width="800" height="320">
                  <rect id="word-wipe" x="170" y="560" width="0" height="220" fill="url(#wipe-g)"/>
                </mask>
              </defs>
              <g id="logo-cup"><path id="p-cup"/></g>
              <g id="logo-stroke" mask="url(#stroke-mask)"><path id="p-halo" filter="url(#wash)" opacity=".3"/><path id="p-stroke"/></g>
              <!-- the soft head of the rising steam: it rides the tip of the line while it is being drawn -->
              <circle id="logo-puff" r="58" fill="url(#puff-g)" opacity="0"/>
              <g id="logo-word" mask="url(#word-mask)"><path id="p-word"/><path id="p-tag"/></g>
            </svg>
          </div>
        </div>

        <div class="hero-copy">
          <h1 id="hero-title" class="sr-only">Cha/Té</h1>
          <p class="hero-line" data-t="home.heroLine"></p>
          <p class="hero-meta" data-t="home.heroMeta"></p>
        </div>

        <div class="scroll-hint" aria-hidden="true"><span data-t="home.scrollHint"></span><i></i></div>
      </div>

      <div class="cup-layer" id="cup" aria-labelledby="cup-title">
        <div class="scene" id="scene">
          <div class="imgbox" id="imgbox">
            <picture>
              <source media="(max-aspect-ratio: 4/5)" srcset="assets/img/cup-teapot-portrait.jpg">
              <img class="scene-img" src="assets/img/cup-teapot.jpg" alt="" decoding="async">
            </picture>
            <canvas class="fx" id="fx" aria-hidden="true"></canvas>
            <video class="pour-video" id="pour-video" muted playsinline preload="none" aria-hidden="true"></video>
            <button class="pot-hit" id="pot-hit" type="button" data-t-aria="home.pour"></button>
          </div>
          <canvas class="steam" id="steam" aria-hidden="true"></canvas>
        </div>
        <div class="scene-shade" aria-hidden="true"></div>

        <div class="cup-copy">
          <p class="kicker" data-t="home.cupKicker"></p>
          <h2 id="cup-title" data-t="home.cupTitle"></h2>
          <div class="cup-paras" id="cup-paras"></div>
          <button class="btn gold pour-btn" id="pour-btn" type="button">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 10h11v3a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5v-3Zm11 1h2a2 2 0 0 1 0 4h-2.3M7 3c0 1.5 1.5 1.5 1.5 3S7 7.5 7 9m4-6c0 1.5 1.5 1.5 1.5 3S11 7.5 11 9"/></svg>
            <span data-t="home.pour"></span></button>
        </div>
      </div>
    </div>
  </section>

  <!-- ACT 3: the tea globe -->
  <section class="act-globe" id="globe" aria-labelledby="globe-title">
    <div class="globe-head wrap">
      <p class="kicker" data-t="home.globeKicker"></p>
      <h2 id="globe-title" data-t="home.globeTitle"></h2>
      <p class="globe-intro" data-t="home.globeIntro"></p>
      <ul class="legend">
        <li><i class="dot cha"></i><span data-t="home.legendCha"></span></li>
        <li><i class="dot te"></i><span data-t="home.legendTe"></span></li>
        <li><i class="dot other"></i><span data-t="home.legendOther"></span></li>
      </ul>
    </div>
    <div class="globe-stage" id="globe-stage">
      <canvas id="globe-canvas" aria-label="Interactive globe of tea rituals"></canvas>
      <div class="globe-dof top" aria-hidden="true"></div>
      <div class="globe-dof bottom" aria-hidden="true"></div>
      <div class="globe-vignette" aria-hidden="true"></div>
      <div class="globe-tip" id="globe-tip" hidden></div>
      <div class="globe-fallback" id="globe-fallback" hidden></div>
      <aside class="tea-panel" id="tea-panel" aria-live="polite" hidden>
        <button class="tea-close" id="tea-close" type="button" data-t-aria="home.close">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        <p class="tea-word" id="tea-word"></p>
        <h3 id="tea-place"></h3>
        <dl>
          <dt data-t="home.panelTeas"></dt><dd id="tea-teas"></dd>
          <dt data-t="home.panelRitual"></dt><dd id="tea-ritual"></dd>
          <dt data-t="home.panelFact"></dt><dd id="tea-fact"></dd>
        </dl>
      </aside>
    </div>
    <div class="wrap">
      <h3 class="list-title" data-t="home.listTitle"></h3>
      <div class="place-list" id="place-list"></div>
      <p class="data-note" data-t="home.dataNote"></p>
    </div>
  </section>

  <!-- Doors to the other pages -->
  <section class="doors paper" aria-labelledby="doors-title">
    <div class="wrap">
      <h2 id="doors-title" data-t="home.doorsTitle"></h2>
      <div class="door-grid" id="door-grid"></div>
    </div>
  </section>
</main>

<script src="assets/js/content.js?v=1119b"></script>
<script src="assets/js/logo.js?v=1119b"></script>
<script src="assets/js/common.js?v=1119b"></script>
<script src="assets/js/home.js?v=1119b"></script>
<script type="module" src="assets/js/globe.js?v=1119b"></script>
</body>
</html>
